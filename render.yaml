services:
  - type: web
    name: energy-anomaly-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: Team@2026#1
      - key: DEMO_PASSWORD
        value: Demo@2026
